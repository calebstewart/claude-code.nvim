<!--
  An editor window with a chat docked to one side, which is the whole idea: the
  conversation is a native split, not a terminal. In the site's accent colour;
  `currentColor` plus a media query is what lets one file serve both schemes,
  since a favicon gets no stylesheet of its own. (No double hyphens in here:
  XML forbids them in a comment, and the whole file then fails to parse.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <style>
    svg { color: #9a5b2e; }
    @media (prefers-color-scheme: dark) { svg { color: #d9a066; } }
  </style>
  <rect x="2" y="4" width="20" height="16" rx="2.5"/>
  <path d="M14.5 4v16"/>
  <circle cx="18.25" cy="12" r="1.5" fill="currentColor" stroke="none"/>
</svg>
